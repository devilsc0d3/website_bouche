<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Entreprise Bouche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://bouche-jc.fr/front/css/colors_stylesheet.css" rel="stylesheet">
    <link rel="icon" href="https://bouche-jc.fr/front/img/icon/logo-c.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        
        .error-container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 3rem;
            border-radius: 12px;
        }
        
        .error-code {
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        
        .error-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 1rem;
            font-weight: 600;
            color: #334155;
        }
        
        .error-message {
            font-size: 1.1rem;
            margin-bottom: 3rem;
            color: #64748b;
            line-height: 1.6;
            font-weight: 400;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin: 3rem 0;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .service-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.5rem 1rem;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(80, 67, 201, 0.15);
            border-color: #5043c9;
            text-decoration: none;
            color: inherit;
        }
        
        .service-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 0.75rem;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        
        .service-card:hover .service-icon {
            opacity: 1;
        }
        
        .service-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #475569;
        }
        
        .buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 3rem 0 2rem;
        }
        
        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #5043c9;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }
        
        .home-button:hover {
            background: #3d34a5;
            transform: translateY(-1px);
            color: white;
        }
        
        .secondary-button {
            background: white;
            color: #5043c9;
            border: 1px solid #5043c9;
        }
        
        .secondary-button:hover {
            background: #5043c9;
            border-color: #5043c9;
            color: white;
        }
        
        .countdown {
            font-size: 0.9rem;
            margin-top: 2rem;
            color: #94a3b8;
            font-weight: 400;
        }
        
        @media (max-width: 768px) {
            .error-container {
                padding: 2rem 1rem;
            }
            
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                margin: 2rem 0;
                max-width: 320px;
            }
            
            .service-card {
                padding: 1rem 0.75rem;
            }
            
            .service-title {
                font-size: 0.8rem;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
            }
            
            .home-button {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: repeat(4, 1fr);
                max-width: 100%;
            }
            
            .service-card {
                padding: 0.75rem 0.5rem;
            }
            
            .service-icon {
                width: 24px;
                height: 24px;
                margin-bottom: 0.5rem;
            }
            
            .service-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="https://bouche-jc.fr/front/img/icon/logo-c.png" alt="Logo Entreprise Bouche" class="logo">
        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page non trouvée</h2>
        
        <p class="error-message">
            La page que vous recherchez n'existe pas ou a été déplacée.
        </p>
        
        <div class="services-grid">
            <a href="https://bouche-jc.fr/about#chauffage" class="service-card">
                <img src="https://bouche-jc.fr/front/img/icon/chauffage.png" alt="Chauffage" class="service-icon">
                <div class="service-title">Chauffage</div>
            </a>
            
            <a href="https://bouche-jc.fr/about#climatisation" class="service-card">
                <img src="https://bouche-jc.fr/front/img/icon/clim.png" alt="Climatisation" class="service-icon">
                <div class="service-title">Climatisation</div>
            </a>
            
            <a href="https://bouche-jc.fr/about#plomberie" class="service-card">
                <img src="https://bouche-jc.fr/front/img/icon/plomberie.png" alt="Plomberie" class="service-icon">
                <div class="service-title">Plomberie</div>
            </a>
            
            <a href="https://bouche-jc.fr/about#salle-de-bain" class="service-card">
                <img src="https://bouche-jc.fr/front/img/icon/salle-de-bain.png" alt="Salle de bain" class="service-icon">
                <div class="service-title">Salle de bain</div>
            </a>
        </div>
        
        <div class="buttons-container">
            <a href="https://bouche-jc.fr" class="home-button">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"/>
                </svg>
                Accueil
            </a>
            <a href="https://bouche-jc.fr/#contact" class="home-button secondary-button">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
                </svg>
                Nous contacter
            </a>
        </div>
        
        <div class="countdown">
            Redirection automatique dans <span id="countdown">60</span> secondes
        </div>
    </div>

    <script>
        // Compte à rebours et redirection automatique
        let countdown = 60;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = '../../index.html';
            }
        }, 1000);
    </script>
</body>
</html>
