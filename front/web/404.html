<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erreur 404</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://bouche-jc.fr/front/css/colors_stylesheet.css?v=2"
      rel="stylesheet"
    />
    <link href="https://bouche-jc.fr/front/css/error_stylesheet.css?v=2" rel="stylesheet" />
    <link rel="icon" href="https://bouche-jc.fr/front/img/icon/logo-c.png" />
  </head>

  <body>
    <div class="error-container">
      <img
        src="https://bouche-jc.fr/front/img/icon/logo-c.png"
        alt="Logo Entreprise Bouche"
        class="logo"
      />

      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page non trouvée</h2>

      <p class="error-message">
        La page que vous recherchez n'existe pas ou a été déplacée.
      </p>

      <div class="services-grid">
        <a href="https://bouche-jc.fr/about#chauffage" class="service-card">
          <img
            src="https://bouche-jc.fr/front/img/icon/chauffage.png"
            alt="Chauffage"
            class="service-icon"
          />
          <div class="service-title">Chauffage</div>
        </a>

        <a href="https://bouche-jc.fr/about#climatisation" class="service-card">
          <img
            src="https://bouche-jc.fr/front/img/icon/clim.png"
            alt="Climatisation"
            class="service-icon"
          />
          <div class="service-title">Climatisation</div>
        </a>

        <a href="https://bouche-jc.fr/about#plomberie" class="service-card">
          <img
            src="https://bouche-jc.fr/front/img/icon/plomberie.png"
            alt="Plomberie"
            class="service-icon"
          />
          <div class="service-title">Plomberie</div>
        </a>

        <a href="https://bouche-jc.fr/about#salle-de-bain" class="service-card">
          <img
            src="https://bouche-jc.fr/front/img/icon/salle-de-bain.png"
            alt="Salle de bain"
            class="service-icon"
          />
          <div class="service-title">Salle de bain</div>
        </a>
      </div>

      <div class="buttons-container">
        <a href="https://bouche-jc.fr" class="home-button">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"
            />
          </svg>
          Accueil
        </a>
        <a
          href="https://bouche-jc.fr/#contact"
          class="home-button secondary-button"
        >
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"
            />
          </svg>
          Nous contacter
        </a>
      </div>

      <div class="countdown">
        Redirection automatique dans <span id="countdown">60</span> secondes
      </div>
    </div>

    <script>
      // Compte à rebours et redirection automatique
      let countdown = 60;
      const countdownElement = document.getElementById("countdown");

      const timer = setInterval(() => {
        countdown--;
        countdownElement.textContent = countdown;

        if (countdown <= 0) {
          clearInterval(timer);
          window.location.href = "https://bouche-jc.fr";
        }
      }, 1000);
    </script>
  </body>
</html>
